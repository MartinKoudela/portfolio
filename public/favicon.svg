<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- MK-01 status LED. 16-unit master: ring outer Ø14, stroke 1; disc Ø8. -->
  <style>
    .paper { fill: #F4F2EC; }
    .ring  { stroke: #191816; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #161513; }
      .ring  { stroke: #EBE8E0; }
    }
  </style>
  <rect class="paper" width="16" height="16"/>
  <circle class="ring" cx="8" cy="8" r="6.5" fill="none" stroke-width="1"/>
  <circle cx="8" cy="8" r="4" fill="#E0763F"/>
</svg>
